# Controladores das juntas do RV-M2 no Gazebo
# Carregados pelo b166er_wb.launch em mode:=gazebo

# Publica /joint_states com as juntas do braço (J1..J5)
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# Controladores de posição — recebem Float64 em rad
J1_position_controller:
  type: position_controllers/JointPositionController
  joint: J1

J2_position_controller:
  type: position_controllers/JointPositionController
  joint: J2

J3_position_controller:
  type: position_controllers/JointPositionController
  joint: J3

J4_position_controller:
  type: position_controllers/JointPositionController
  joint: J4

J5_position_controller:
  type: position_controllers/JointPositionController
  joint: J5

# Ganhos PID do DefaultRobotHWSim (PositionJointInterface)
# Sem estes, gazebo_ros_control rejeita os controladores de posição
gazebo_ros_control:
  pid_gains:
    J1: {p: 100.0, i: 0.0, d: 15.0}
    # 2026-10-07: termo integral em J2/J3 (i_clamp pequeno). O P puro cede
    # sob gravidade (J2: 17–28 N·m / 300 = 3–5°) e o JointPositionController
    # limita o comando ao limite do URDF, logo os últimos 3,5° antes do
    # batente superior do J2 eram inalcançáveis (parava em 61,5°) — o fim
    # de curso emulado nunca fechava e o homing falhava. Um motor real não
    # cede: encosta no batente. i_clamp baixo limita o windup em contato.
    J2: {p: 300.0, i: 40.0, d: 48.0, i_clamp: 20.0}
    J3: {p: 200.0, i: 30.0, d: 30.0, i_clamp: 10.0}
    J4: {p: 100.0, i: 0.0, d: 12.0}
    J5: {p:  50.0, i: 0.0, d:  6.0}
