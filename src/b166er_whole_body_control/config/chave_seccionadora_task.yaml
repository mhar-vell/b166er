# Fases da abertura da chave seccionadora.
#
# Cada offset é a posição alvo do tool_tip — a BASE DO DEGRAU do dedo
# fixo — em relação ao CENTRO DO OLHAL, no frame da parede:
#
#   X = lateral, ao longo da parede. É o eixo do furo do olhal, e
#       portanto a direção em que o degrau atravessa.
#   Y = afastamento da parede (normal frontal), positivo em direção
#       ao robô.
#   Z = vertical.
#
# Sequência definida pelo Marco em 2026-08-26 (Notebook 18, pág. 4):
# aproximar por baixo/ao lado, atravessar o degrau, DESCER para apoiar
# o arame, acompanhar o arco, e sair lateralmente. A saída lateral não
# existia antes — sem ela o recolhimento arrastaria a chave.
#
# A geometria do arco vem de: olhal a 200 mm do pivô, giro em torno de
# X. Para 15° -> ΔY=+51,8 ΔZ=−6,8 mm; para 30° -> ΔY=+100,0 ΔZ=−26,8 mm.
# Se o raio real da bancada for diferente, SÓ ESTES NÚMEROS mudam.
chave_seccionadora_task:
  target_frame: "chave_olhal_link"

  # ── 1. ao lado do furo, na altura do centro dele ──
  # A folga lateral é generosa de propósito: é a etapa que depende da
  # precisão de estacionamento (~2 cm medidos), e errar aqui só custa
  # uma nova tentativa, não uma colisão.
  aproxima_lateral:
    offset_xyz_m: [-0.090, 0.0, 0.0085]

  # ── 2. avança em X: o degrau atravessa o furo ──
  # Centrado na altura do furo, sem tocar o arame.
  atravessa:
    offset_xyz_m: [0.0, 0.0, 0.0085]

  # ── 3. desce e APOIA o arame sobre o degrau ──
  # É aqui que a captura acontece. O curso depende do raio do furo:
  # com Ø27 mm dá os 5 mm que o Marco especificou; com os Ø56 mm que
  # estão modelados hoje dá 19,5 mm. Quando o olhal real for medido,
  # este é o número a corrigir — e a descida especificada é, na prática,
  # uma medida indireta do furo.
  captura:
    offset_xyz_m: [0.0, 0.0, -0.0195]

  # ── 4. acompanha o arco ──
  # Força pequena em Y: o degrau sustenta por baixo e o anel desliza
  # livremente sobre ele. A ferramenta não persegue a trajetória, só
  # não pode descer menos que o olhal nem recuar mais rápido que ele.
  arco1:
    offset_xyz_m: [0.0, 0.0518, -0.0263]
    blade_angle_deg: 15
  arco2:
    offset_xyz_m: [0.0, 0.1000, -0.0463]
    blade_angle_deg: 30

  # ── 5. sai lateralmente, desengatando ──
  # Move em −X mantendo Y e Z do fim do arco: o degrau escorrega para
  # fora do anel sem puxá-lo de volta.
  desengata:
    offset_xyz_m: [-0.090, 0.1000, -0.0463]
