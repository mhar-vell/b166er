# Posturas nomeadas do braço RV-M2 (espaço de juntas, rad, ordem J1..J5).
# Carregado pelo b166er_wb.launch; consumido pelo gazebo_arm_bridge
# (home inicial + comandos de postura) e pela máquina de estados da
# tarefa da chave seccionadora.
#
# HOME RECOLHIDO (stow) — definido pelo Marco em 2026-08-13: "deslocar
# o eixo 2 para cima e o eixo 3 pra baixo, dessa forma o manipulador
# ficará como se estivesse recolhido, próximo ao ponto G [centro de
# gravidade] do sistema". Motivação direta: o braço esticado na
# horizontal (q=0) já tombou o robô duas vezes em testes no Gazebo
# (2026-08-12) — CG adiantado + alavanca de ~0,94m até a ponta da
# ferramenta. Números da postura verificados por FK (2026-08-13):
#   esticado : CG do braço 0,234m à frente | ponta da ferramenta 0,94m
#   recolhido: CG do braço 0,175m à frente | ponta da ferramenta 0,35m
# J2/J3 ficam perto (mas dentro) dos limites [-1.134, 1.134] /
# [-1.047, 1.047]; J4=-1.8 dobra o punho para a ferramenta recolher
# junto (limite ±1.920).
# J2/J3 no limite de junta do URDF (±1.134 / ±1.047 rad, com margem
# mínima contra saturação) — decisão do Marco em 2026-08-13 ("aplique o
# limite"): o recolhimento máximo permitido pelos limites atuais. Se um
# dia o range do ombro for revisado contra o manual do RV-M2 (o clássico
# é assimétrico, tipo -30°/+100°), dá pra recolher mais.
arm_postures:
  stow_home: [0.0, 1.13, -1.04, -1.8, 0.0]

  # ═══ Postura de BUSCA DA TAG — refeita em 2026-08-27 ═══
  #
  # Especificação do Marco: os links de J3, J4 e J5 PARALELOS AO CHÃO e
  # alinhados entre si. Traduzido para a cadeia do URDF, o link depois de
  # uma junta de pitch fica horizontal quando a soma dos ângulos de pitch
  # acumulados até ele é zero. Logo:
  #
  #     L3 horizontal  <=>  J2 + J3 = 0
  #     L4 horizontal  <=>  J2 + J3 + J4 = 0   =>  J4 = 0
  #
  # (Há uma segunda família de soluções em J2+J3 = π, mas ela não cabe:
  # J2 vai a ±65° e J3 a ±60°, somando no máximo 125°.)
  #
  # A postura ANTERIOR era [1.5708, 1.13, -1.04, -1.8, 0]: L3 já estava a
  # 5,2° da horizontal, mas J4 estava a **-82°**, com o punho apontado
  # para baixo. O comentário antigo dizia que J1=+90° punha a câmera
  # olhando para a frente; a FK diz outra coisa — o eixo óptico saía em
  # azimute -90° e elevação **-51,7°**, ou seja, encarando o chão ao lado
  # do robô. Só funcionava porque a fisheye tem 170° de campo e a tag
  # aparecia na periferia, que é a região de pior projeção do modelo
  # equidistante. Suspeito principal do resíduo de 20-30° de orientação
  # do PnP que ficou sem explicação.
  #
  # Agora: J2=+57,3° / J3=-57,3° (L3 e L4 exatamente horizontais),
  # J4=0, e J5=-89,9° para levantar o eixo óptico à horizontal — a T265
  # é montada INCLINADA no gripper (rpy [0, 2.1, 1.57] em _T_L5_TOOLTIP),
  # então alinhar os links não basta, quem endireita a câmera é J5.
  # J1=-30,3° põe o eixo óptico no +X da base. Conferido por FK:
  #
  #     elevação do eixo óptico  -0,02°   (era -51,7°)
  #     azimute                  +0,02°   (era -90°)
  #     câmera a 0,642 m de altura; a tag (0,805 m) fica a +4,6° do eixo
  #     a 2 m, e +13,1° no standoff de 0,70 m — perto do centro do quadro
  #
  # POR QUE J4=0 IMPORTA ALÉM DA CÂMERA: no RV-M2 o J5 aciona a interface
  # mecânica através da ENGRENAGEM CÔNICA ⑰, que é carregada pela carcaça
  # do punho — e é o J4 que gira essa carcaça (manual BFP-A5296E-A,
  # Fig. 4.3.1 e seção 3.1, itens 4 e 5). Inclinar J4 rola a ferramenta
  # mesmo com o motor do J5 parado. O URDF e o kinematics.py modelam as
  # duas juntas como INDEPENDENTES, então esse termo não existe na
  # simulação. Com J4 = 0 o termo é nulo por construção: esta é a postura
  # em que o modelo e o braço real concordam melhor.
  #
  # Margem até os limites (graus): J1 119,7 | J2 7,7 | J3 2,7 | J4 110 |
  # J5 90,1. J3 é o apertado; não aumentar J2 sem baixar J3 junto.
  #
  # ── J1 = 0 e J5 = 0 (2026-09-02) ──
  #
  # Os dois valores acima (J1 = -30,3°, J5 = -89,9°) COMPENSAVAM a T265
  # montada torta (rpy 0 2.1 1.57): J1 girava o braço para pôr o eixo
  # óptico no +X da base, e J5 endireitava a câmera inclinada. A T265
  # foi remontada nos furos do suporte, olhando reto ao longo da
  # ferramenta (PR #37), e as duas compensações viraram erro:
  #
  #   · J1 = -30,3° passou a apontar a câmera 30° para o LADO
  #     (FK: azimute -30,3°). run1 da revalidação: SEARCH mediu a
  #     parede 0,57 m curta e a remedida perdeu a tag.
  #   · J5 = -89,9° deixou de apontar nada — com a câmera reta ele só
  #     ROLA a imagem, e rolava a ferramenta para exatamente a faixa
  #     do quadro por onde a tag entra. Medido na bancada de pose
  #     (mesma parada do SEARCH, girando a base): com J5 = -90 a tag
  #     some atrás do dedo fixo entre 24° e 49° fora do eixo (zero
  #     detecções), e no standoff do REFINE (0,49 m, tag a 22°) o
  #     localizador ficou 20 s sem uma detecção. Com J5 = 0:
  #
  #       fora do eixo   48°    35°    22°     REFINE 0,49 m
  #       aceitas/5 s     47     41     22        74 de 74
  #       parede (m)    3,07   3,06   2,96      3,025   (verdade 2,98)
  #
  # O que J5 = 0 NÃO resolve: a ~1,5 m (24 px) uma tag vista de FRENTE
  # (< ~10° fora do eixo) é rejeitada por ambiguidade do PnP em quase
  # 100% dos quadros — a 1,28 m (29 px) passa. E o SEARCH ainda amostra
  # na primeira detecção, a ~71° na borda, onde mede 0,37 m curto; a
  # curva diz que entre 22° e 48° o erro cai para 2–9 cm.
  search: [0.0, 1.0, -1.0, 0.0, 0.0]

  # ═══ Postura de DESLOCAMENTO ═══
  #
  # Observação do Marco em 2026-08-27, vendo a missão rodar: a J2
  # deveria estar recolhida, perto do centro de gravidade, durante a
  # movimentação. O instinto estava certo; medindo, o dedo estava na
  # junta errada:
  #
  #   postura            J2     J4  | CG r_xy | ferramenta r_xy
  #   recolhida (esta)  64,7  -103  |  170 mm |     388 mm
  #   busca (alinhada)  57,3     0  |  182 mm |     735 mm
  #   J2 no limite      65,0     0  |  169 mm |     706 mm
  #
  # Levar a J2 ao limite move o CG 13 mm e recolhe a ferramenta 29 mm.
  # Quem recolhe 347 mm é DOBRAR A J4. E J4=0 é exatamente o que alinha
  # J3/J4/J5 na horizontal para a busca da tag — as duas coisas que o
  # Marco pediu se opõem na MESMA postura.
  #
  # Só que não precisam conviver: o SEARCH gira PARADO (olhar) e o
  # APPROACH DIRIGE (andar). Esta postura é usada nos trechos de
  # deslocamento; a 'search' volta para as medições.
  #
  # Mantém o J1 da postura de busca, para a câmera continuar apontada
  # para a frente e a tag seguir no quadro durante o deslocamento — com
  # 170° de campo ela aparece mesmo com o eixo óptico 52° para baixo,
  # que foi como a missão funcionou até hoje.
  travel: [-0.5289, 1.13, -1.04, -1.8, 0.0]

  # Postura de pré-manipulação. J1=0, NÃO 90° como a postura de busca:
  # a câmera está montada 90° defasada da direção de alcance do braço,
  # então J1=+90° aponta a CÂMERA para a frente mas o BRAÇO para o lado.
  # Verificado por FK em 2026-08-13: com J1=90° a ponta da ferramenta
  # cai em (0.003, 0.911, 0.831) no frame da base — lateral; com J1=0
  # cai em (0.723, 0.000, 0.568) — de frente, na direção da parede e já
  # praticamente na altura do olhal (0.546 no frame da base).
  #
  # Esse era o motivo da "última milha": partindo de J1=90° o DLS
  # estacionava a 4,5 cm do olhal, num mínimo local da bacia errada,
  # apesar de o alvo ser alcançável com folga (erro mínimo teórico de
  # ~1 cm no standoff de 0,80 m, sem nenhuma junta saturando).
  #
  # Perder a tag de vista aqui não custa nada: o REFINE já mediu a
  # parede antes do DEPLOY, e a manipulação usa essa estimativa.
  deploy: [0.0, 0.6, -0.4, -1.2, 0.0]

  # Velocidade da rampa de postura (rad/s por junta) — movimento
  # deliberadamente lento: postura muda entre fases da tarefa, nunca
  # com pressa, e degraus bruscos de setpoint com P=300 (J2) já
  # chutaram o chassi no passado (ver b166er_gazebo.launch).
  ramp_velocity: 0.3
  # Tolerância para considerar a postura atingida (rad, por junta)
  reached_tolerance: 0.02
