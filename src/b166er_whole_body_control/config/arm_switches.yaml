# FINS DE CURSO do RV-M2 retrofitado — a única medida ABSOLUTA de junta que
# o braço tem (não há encoder). Lido em /arm_switches por três nós:
#   · arm_openloop_sim.py  (firmware emulado: switch "fecha" nestes ângulos,
#                           corta o sentido e publica /b166er/arm_limit_switch)
#   · state_estimator.py   (junta no switch -> estimativa ancorada no ângulo)
#   · arm_joint_servo.py   (HOMING: leva cada junta até o seu switch ao ligar)
# As placas reais leem os pinos LS_xA/LS_xB.
#
# ÂNGULOS (14 Out 2026): os do robô RETROFITADO, não os do manual. O Cerbaro
# instalou/ajustou os fins de curso e documentou (dissertação, cap. 3):
#   Tabela 2 (p. 42) limites de trabalho: J1 ±100, J2 −30…+100, J3 −120…0,
#                    J4 ±100, J5 ±180
#   Tabela 3 (p. 47) "configuração home" = onde o homing acha o switch:
#                    J1 0, J2 106, J3 −123, J4 0, J5 0
#   p. 42: chapa do switch do J1 invertida (atua com ângulo menor nos dois
#          lados); chapa do J4 movida (±100, para a câmera não bater no corpo).
# Switch do J2 de trás em 106° (16° depois da vertical — confere com a foto
# do Marco, 14 Out) e do J3 em −123°: os únicos dois documentados além dos
# limites de trabalho. Nas demais juntas o switch é posto no próprio limite
# de trabalho + margem, de modo que FECHA exatamente no limite. Decisão do
# Marco (14 Out): usar os switches nas posições originais do Cerbaro.
# Até 13 Out valiam os ângulos do manual repartidos ao meio (±150/±65/±60/
# ±110/±180) — por isso a bateria de 09 Out tem J2 em 63,5° no home.
#
# Convenção: lower = switch do lado negativo da junta (B nas placas),
# upper = lado positivo (A).
lower_deg: [-100.0, -31.5, -123.0, -100.0, -180.0]
upper_deg: [ 100.0, 106.0,    1.5,  100.0,  180.0]
# margem_deg: o switch FECHA a esta distância antes do ângulo acima (um
# switch mecânico atua antes do batente; na simulação o batente do ODE
# assenta 0,3–0,9° antes do limite nominal sob carga). O estimador ancora
# a junta no ângulo em que o switch fecha (lower + margem / upper − margem):
# J1 ±98,5 · J2 −30 / 104,5 · J3 −121,5 / 0 · J4 ±98,5 · J5 ±178,5.
# kinematics.JOINT_LOWER/UPPER (limites de trabalho da IK) ficam DENTRO
# desses ângulos de fechamento.
margem_deg: 1.5

# HOMING (origem por switch, como o controlador original do RV-M2).
# home_side: para que lado cada junta vai ao ligar: +1 (upper), -1 (lower),
# 0 = não faz. TODAS as cinco juntas (Marco, 09 Out 2026: "inclui J1 e J5
# no homing, J1 procura o switch de trás"). Eu tinha deixado J1 e J5 de
# fora supondo que a T265 os observa — vale na simulação, onde câmera e
# odometria compartilham o referencial; no robô real a guinada da T265 é
# relativa a onde ELA acordou, que depende do J1 ao ligar: sem switch,
# o zero do J1 é inventado. J2 no upper (+106 = recolhido, atrás da
# vertical), J3 no lower (−123, antebraço dobrado), J4 no lower (−100),
# J5 no upper (+180, meia-volta do punho, inofensiva). J1 no upper (+100):
# cintura girando para a ESQUERDA (vista de trás) — com ±100° nenhum dos
# lados "aponta para trás"; se no laboratório o lado livre for o outro,
# trocar para -1. Depois do último switch o servo vai à postura home de
# arm_postures.yaml (J1/J5 em zero, J2/J3 onde os switches fecham, J4 0).
home_side:   [1, 1, -1, -1, 1]
# J2 SÓ PARA TRÁS (Marco, 07 Out 2026): "quanto a J2 eu só faria o homing
# para trás, nem tentaria fazer para baixo pois seria um risco". home_side
# de J2 tem de ser +1 (o servo recusa −1). Os limites de trabalho do J2
# vivem em B166ER_J2_MIN_DEG / _MAX_DEG (args dos launches; padrão −30/+100).
home_ordem:  [4, 3, 2, 5, 1]    # punho, cotovelo, ombro, rolagem; a CINTURA por último, com o braço já recolhido
home_v_deg:  [10.0, 5.0, 5.0, 5.0, 10.0]
home_timeout_s: 40.0
